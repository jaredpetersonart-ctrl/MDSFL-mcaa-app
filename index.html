<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MDSFL & MCAA - Dynasty Portal</title>

    <!-- PWA & Mobile Web App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dynasty Portal">
    <meta name="theme-color" content="#0b0e14">

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151a23;
            --bg-card-border: #222938;
            --accent-blue: #38bdf8;
            --accent-gold: #f59e0b;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --nav-bg: rgba(11, 14, 20, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Mobile Viewport Container */
        .app-shell {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: #0d1117;
            position: relative;
            padding-bottom: 75px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }

        /* Top Header Bar */
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1a202c;
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .header-icon-btn:active {
            transform: scale(0.92);
        }

        .live-audio-btn {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .live-pulse {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* League Selector Toggle */
        .league-toggle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .toggle-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: 600;
        }

        .league-toggle {
            display: flex;
            background: #12161f;
            border-radius: 20px;
            padding: 3px;
            border: 1px solid var(--bg-card-border);
        }

        .toggle-btn {
            padding: 4px 14px;
            border-radius: 16px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .toggle-btn.active {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* Sub-Header Horizontal Navigation Tabs */
        .sub-nav {
            display: flex;
            overflow-x: auto;
            background: #11151d;
            padding: 8px 12px;
            gap: 8px;
            border-bottom: 1px solid var(--bg-card-border);
            scrollbar-width: none;
        }

        .sub-nav::-webkit-scrollbar {
            display: none;
        }

        .sub-tab {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
        }

        .sub-tab.active {
            color: #ffffff;
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.3);
        }

        /* Main Content View */
        .content-area {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .view-pane {
            display: none;
        }

        .view-pane.active {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Hero Card Section */
        .hero-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--bg-card-border);
        }

        .hero-image-wrap {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
        }

        .hero-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #0f172a 10%, transparent 80%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
        }

        .hero-team-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hero-title {
            font-family: 'Teko', sans-serif;
            font-size: 2.8rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* Matchup Score Card */
        .matchup-card {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .matchup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .matchup-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .team-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 35%;
        }

        .team-logo-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
            font-size: 1.4rem;
            color: var(--accent-blue);
        }

        .team-name {
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
        }

        .matchup-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .status-badge {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 1
